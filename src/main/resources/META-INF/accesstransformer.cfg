# Access Transformers for BobbyPipes (NeoForge)
# Widen visibility to avoid reflection in renderers.

# ChestRenderer has the SpriteGetter and model resources we need.
public net.minecraft.client.renderer.blockentity.ChestRenderer sprites
public net.minecraft.client.renderer.blockentity.ChestRenderer models

# Allow replacing opener logic so custom menus keep the lid open
protected-f net.minecraft.world.level.block.entity.ChestBlockEntity openersCounter

# Hopper / save paths read the private items list directly; widen so we can clear it on save and merge on load.
protected-f net.minecraft.world.level.block.entity.ChestBlockEntity items

# applyImplicitComponents skips CONTAINER copy but must still set name/lock like BaseContainerBlockEntity.
protected-f net.minecraft.world.level.block.entity.BaseContainerBlockEntity name
protected-f net.minecraft.world.level.block.entity.BaseContainerBlockEntity lockKey

